<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Used Car Price Predictor</title>

  <script src="https://cdn.jsdelivr.net/npm/onnxjs@0.1.8/dist/onnx.min.js"></script>
  <script src="./index.js" defer></script>

  <style>
      body {
          box-sizing: border-box;
          max-width: 720px;
          margin: 0 auto;
          padding: 16px;
          background: #fff;
          color: #1f2328;
          font-family: Arial, Helvetica, sans-serif;
      }
      table, th, td {
          border: 1px solid #1f2328;
          border-collapse: collapse;
          padding: 5px;
      }
      table {
          width: 100%;
      }
      th {
          text-align: left;
      }
      h1 {
          color: green;
          text-align: center;
      }
      .input-group {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 10px;
      }
      .input-group label {
          flex: 0 0 120px;
      }
      .input-group select,
      .input-group input {
          box-sizing: border-box;
          flex: 1 1 auto;
          min-width: 0;
          width: 100%;
          padding: 5px;
          font-size: 16px;
      }
      .actions {
          display: flex;
          flex-wrap: wrap;
          gap: 10px;
          margin-top: 10px;
      }
      .actions input {
          padding: 10px;
          font-size: 16px;
      }
      #predictButton {
          background-color: yellow;
      }
      .error {
          color: #b00020;
      }
      .price {
          color: green;
          font-weight: bold;
      }
      .note {
          font-size: 14px;
      }
      @media (max-width: 480px) {
          .input-group {
              display: block;
          }
          .input-group label {
              display: block;
              margin-bottom: 4px;
          }
      }
  </style>
</head>
<body>

  <h1>Used Car Price Predictor</h1>

  <div id="boxes1">
      <div class="input-group">
          <label for="box1">Brand:</label>
          <select id="box1"></select>
      </div>

      <div class="input-group">
          <label for="box2">Model:</label>
          <select id="box2"></select>
      </div>

      <div class="input-group">
          <label for="box3">Model Year:</label>
          <input type="number" id="box3" step="1" value="2018">
      </div>

      <div class="input-group">
          <label for="box4">Mileage:</label>
          <input type="number" id="box4" min="0" step="1" value="45000">
      </div>

      <div class="input-group">
          <label for="box5">Fuel Type:</label>
          <select id="box5"></select>
      </div>

      <div class="input-group">
          <label for="box6">Engine:</label>
          <select id="box6"></select>
      </div>

      <div class="input-group">
          <label for="box7">Transmission:</label>
          <select id="box7"></select>
      </div>

      <div class="input-group">
          <label for="box8">Exterior Color:</label>
          <select id="box8"></select>
      </div>

      <div class="input-group">
          <label for="box9">Interior Color:</label>
          <select id="box9"></select>
      </div>

      <div class="input-group">
          <label for="box10">Accident History:</label>
          <select id="box10"></select>
      </div>
  </div>

  <div class="actions">
      <input id="predictButton" type="button" value="Predict Price" onclick="runExample()" disabled>
  </div>

  <div id="boxes2">
      <h2>Inference</h2>
      <div id="predictions"></div>
  </div>

  <p class="note">
      This neural network was trained on used car listings with clean titles. On held-out test cars,
      its typical error was about 23% of the listed price. This is an estimate, not an appraisal.
  </p>

</body>
</html>
